plugins {
    id 'org.openapi.generator' version '7.25.0'
    id 'com.diffplug.spotless' version '8.10.2'
}

// Let Git identify repository text files, including untracked files and dotfiles.
// Ignored build output and files marked/detected as binary are not formatted.
def repositoryTextFiles = providers.exec {
    commandLine 'git', 'ls-files', '--cached', '--others', '--exclude-standard', '--eol', '-z'
}.standardOutput.asText.map { listing ->
    listing.split('\u0000').findAll { entry ->
        def metadata = entry.substring(0, entry.indexOf('\t'))
        !metadata.contains('w/-text') && !metadata.contains('attr/-text')
    }.collect { entry -> entry.substring(entry.indexOf('\t') + 1) }.unique()
}

spotless {
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    format('text') {
        // Java sources are handled by the subproject Palantir formatters.
        target files(repositoryTextFiles.get().findAll { !it.endsWith('.java') })
    }
}

subprojects {
    version = rootProject.version

    plugins.withId('java') {
        tasks.named('jar') {
            manifest.attributes('Implementation-Version': project.version.toString())
        }
        apply plugin: 'com.diffplug.spotless'
        spotless {
            lineEndings = com.diffplug.spotless.LineEnding.UNIX
            java {
                target 'src/**/*.java'
                palantirJavaFormat()
            }
        }
    }
}

configure([project(':engine'), project(':runtime')]) {
    plugins.withId('java') {
        def lombokDependency = 'org.projectlombok:lombok:1.18.48'
        dependencies {
            compileOnly lombokDependency
            annotationProcessor lombokDependency
            testCompileOnly lombokDependency
            testAnnotationProcessor lombokDependency
        }
    }
}

openApiGenerate {
    generatorName = 'java'
    inputSpec = layout.projectDirectory.file('openapi/src/main/open-hab/spec.json').asFile.absolutePath
    outputDir = layout.buildDirectory.dir('generated/openapi').get().asFile.absolutePath
    apiPackage = 'org.openhab.cli.client.api'
    modelPackage = 'org.openhab.cli.client.model'
    invokerPackage = 'org.openhab.cli.client'
    generateApiTests = false
    generateModelTests = false
    // Keep array aliases as named models when they are used in oneOf schemas.
    generateAliasAsModel = true
    // Avoid collisions between schema names and Gson's JSON types.
    modelNameMappings = [
        JsonElement: 'OpenHabJsonElement',
        JsonArray: 'OpenHabJsonArray',
        JsonObject: 'OpenHabJsonObject',
        JsonPrimitive: 'OpenHabJsonPrimitive',
        JsonNull: 'OpenHabJsonNull'
    ]
    configOptions = [hideGenerationTimestamp: 'true', artifactVersion: project.version.toString()]
}
