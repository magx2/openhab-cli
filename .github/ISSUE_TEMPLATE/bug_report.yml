name: Bug report
description: Report a reproducible problem with openhab-cli
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Before submitting, enable DEBUG logging as described in the README, reproduce the issue, and attach the resulting log below.

  - type: input
    id: cli-version
    attributes:
      label: openhab-cli version
      description: Run `oh --version` and paste the result.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: openhab-version
    attributes:
      label: openHAB version
      description: Enter the version of the openHAB server.
      placeholder: 5.2.1
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Linux native executable
        - Windows native executable
        - Runnable JAR
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, etc.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command you ran, but replace credentials and other secrets.
      placeholder: |
        1. Configure ...
        2. Run `oh ...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: debug-log
    attributes:
      label: DEBUG log
      description: Enable DEBUG logging using the README instructions, reproduce the issue, then drag and drop `~/.oh/oh.log` here. Review the file and remove secrets and private data before uploading it.
      placeholder: Drag and drop the sanitized oh.log file here.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I reviewed the attached log and removed credentials and other sensitive information.
          required: true
